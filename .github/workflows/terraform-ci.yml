# ============================================================
# Terraform CI Pipeline
# ============================================================

name: Terraform CI


# ============================================================
# PIPELINE TRIGGER
# ============================================================
#
# Runs when a Pull Request is created or updated
# against the main branch.
#

on:
  pull_request:
    branches:
      - main


# ============================================================
# JOB
# ============================================================

jobs:

  terraform:

    name: Terraform CI


    # ========================================================
    # SELF-HOSTED WINDOWS RUNNER
    # ========================================================
    #
    # The GitHub Actions job will run on our own
    # Windows self-hosted runner.
    #
    runs-on: [self-hosted, Windows, X64]


    # ========================================================
    # AZURE VARIABLES
    # ========================================================
    #
    # These values are configured in:
    #
    # GitHub Repository
    #   -> Settings
    #   -> Secrets and variables
    #   -> Actions
    #   -> Variables
    #
    # Required:
    #
    # AZURE_CLIENT_ID
    # AZURE_TENANT_ID
    # AZURE_SUBSCRIPTION_ID
    # AZURE_CLIENT_SECRET
    #
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ vars.AZURE_CLIENT_SECRET }}


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ------------------------------------------------------
      #
      # Downloads the repository code to the self-hosted
      # runner workspace.
      #

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. SETUP TERRAFORM
      # ------------------------------------------------------
      #
      # Installs/configures Terraform on the runner.
      #

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ------------------------------------------------------
      # 3. AZURE LOGIN
      # ------------------------------------------------------
      #
      # Authentication method:
      #
      # Service Principal + Client Secret
      #
      # NO OIDC
      # NO Federated Credential
      #
      # The Service Principal is associated with the
      # Azure App Registration: azure-3tier
      #

      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ env.AZURE_CLIENT_SECRET }}


      # ------------------------------------------------------
      # 4. VERIFY AZURE LOGIN
      # ------------------------------------------------------
      #
      # Confirms that the runner is authenticated to Azure.
      #

      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show
          az account list --output table


      # ------------------------------------------------------
      # 5. TERRAFORM FORMAT CHECK
      # ------------------------------------------------------
      #
      # Checks Terraform formatting.
      #
      # -check:
      #   Does not modify files.
      #
      # -recursive:
      #   Checks Terraform files recursively.
      #

      - name: Terraform Format Check
        shell: powershell
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # 6. TERRAFORM INIT
      # ------------------------------------------------------
      #
      # Terraform configuration is located under:
      #
      # Environments/dev
      #
      # terraform init:
      #   - Initializes Terraform
      #   - Downloads providers
      #   - Initializes backend
      #   - Initializes modules
      #

      - name: Terraform Init
        working-directory: Environments/dev
        shell: powershell
        run: terraform init


      # ------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # ------------------------------------------------------
      #
      # Validates Terraform configuration.
      #
      # Does not create or modify Azure resources.
      #

      - name: Terraform Validate
        working-directory: Environments/dev
        shell: powershell
        run: terraform validate


      # ------------------------------------------------------
      # 8. SETUP TFLINT
      # ------------------------------------------------------
      #
      # Installs TFLint.
      #

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4


      # ------------------------------------------------------
      # 9. INITIALIZE TFLINT
      # ------------------------------------------------------
      #
      # Initializes TFLint plugins/configuration.
      #

      - name: Initialize TFLint
        working-directory: Environments/dev
        shell: powershell
        run: tflint --init


      # ------------------------------------------------------
      # 10. RUN TFLINT
      # ------------------------------------------------------
      #
      # Performs Terraform linting and best-practice checks.
      #

      - name: Run TFLint
        working-directory: Environments/dev
        shell: powershell
        run: tflint


      # ------------------------------------------------------
      # 11. TFSEC SECURITY SCAN
      # ------------------------------------------------------
      #
      # Scans Terraform code for security misconfigurations.
      #

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Environments/dev


      # ------------------------------------------------------
      # 12. TERRAFORM PLAN
      # ------------------------------------------------------
      #
      # Shows the changes Terraform would make.
      #
      # + create
      # ~ update
      # - destroy
      #
      # IMPORTANT:
      # terraform plan does NOT modify Azure infrastructure.
      #

      - name: Terraform Plan
        working-directory: Environments/dev
        shell: powershell
        run: terraform plan