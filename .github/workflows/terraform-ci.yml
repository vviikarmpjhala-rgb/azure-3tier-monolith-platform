# ============================================================
# Terraform CI Pipeline
# ============================================================

name: Terraform CI


# ============================================================
# PIPELINE TRIGGER
# ============================================================
#
# This pipeline runs whenever a Pull Request is created or
# updated and the target branch is main.
#
on:
  pull_request:
    branches:
      - main


# ============================================================
# OIDC PERMISSIONS
# ============================================================
#
# id-token: write
# ----------------
# Allows GitHub Actions to request an OIDC token.
#
# contents: read
# --------------
# Allows the workflow to checkout/read repository code.
#
permissions:
  id-token: write
  contents: read


# ============================================================
# JOB
# ============================================================

jobs:

  terraform:

    name: Terraform CI


    # ========================================================
    # SELF-HOSTED RUNNER
    # ========================================================
    #
    # We are using our own Windows self-hosted GitHub runner.
    #
    # GitHub will select a runner having ALL these labels:
    #
    #   self-hosted
    #   Windows
    #   X64
    #
    runs-on: [self-hosted, Windows, X64]


    # ========================================================
    # AZURE VARIABLES
    # ========================================================
    #
    # These values are configured under:
    #
    # GitHub
    #   -> Repository
    #      -> Settings
    #         -> Secrets and variables
    #            -> Actions
    #               -> Variables
    #
    # Required variables:
    #
    # AZURE_CLIENT_ID
    # AZURE_TENANT_ID
    # AZURE_SUBSCRIPTION_ID
    #
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------
      #
      # Downloads the repository code to the self-hosted
      # runner workspace.
      #
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. SETUP TERRAFORM
      # ------------------------------------------------------
      #
      # Installs/configures Terraform on the runner.
      #
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ------------------------------------------------------
      # 3. AZURE LOGIN USING OIDC
      # ------------------------------------------------------
      #
      # Authentication flow:
      #
      # GitHub Actions
      #       |
      #       | OIDC Token
      #       v
      # Microsoft Entra ID
      #       |
      #       v
      # App Registration
      #       |
      #       v
      # Azure Subscription
      #
      # No client secret is required.
      #
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # 4. VERIFY AZURE LOGIN
      # ------------------------------------------------------
      #
      # This is extremely useful for troubleshooting.
      #
      # It confirms that GitHub Actions is authenticated
      # against the expected Azure subscription.
      #
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show
          az account list --output table


      # ------------------------------------------------------
      # 5. TERRAFORM FORMAT CHECK
      # ------------------------------------------------------
      #
      # Checks Terraform formatting.
      #
      # -check      -> Only checks, does not modify files.
      # -recursive  -> Checks Terraform files recursively.
      #
      - name: Terraform Format Check
        shell: powershell
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # 6. TERRAFORM INIT
      # ------------------------------------------------------
      #
      # Terraform configuration is under:
      #
      # Environments/dev
      #
      # Therefore this command runs from that directory.
      #
      - name: Terraform Init
        working-directory: Environments/dev
        shell: powershell
        run: terraform init


      # ------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # ------------------------------------------------------
      #
      # Validates Terraform syntax and configuration.
      #
      # It does NOT create Azure resources.
      #
      - name: Terraform Validate
        working-directory: Environments/dev
        shell: powershell
        run: terraform validate


      # ------------------------------------------------------
      # 8. SETUP TFLINT
      # ------------------------------------------------------
      #
      # Installs TFLint.
      #
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4


      # ------------------------------------------------------
      # 9. INITIALIZE TFLINT
      # ------------------------------------------------------
      #
      # Downloads/initializes required TFLint plugins.
      #
      - name: Initialize TFLint
        working-directory: Environments/dev
        shell: powershell
        run: tflint --init


      # ------------------------------------------------------
      # 10. RUN TFLINT
      # ------------------------------------------------------
      #
      # Performs Terraform linting and best-practice checks.
      #
      - name: Run TFLint
        working-directory: Environments/dev
        shell: powershell
        run: tflint


      # ------------------------------------------------------
      # 11. TFSEC SECURITY SCAN
      # ------------------------------------------------------
      #
      # Scans Terraform code for security misconfigurations.
      #
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Environments/dev


      # ------------------------------------------------------
      # 12. TERRAFORM PLAN
      # ------------------------------------------------------
      #
      # Shows what Terraform intends to create/update/destroy.
      #
      # + create
      # ~ update
      # - destroy
      #
      # IMPORTANT:
      # terraform plan DOES NOT modify Azure infrastructure.
      #
      - name: Terraform Plan
        working-directory: Environments/dev
        shell: powershell
        run: terraform plan